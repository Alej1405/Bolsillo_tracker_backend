<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Bolsillo API — el backend que hace las cuentas">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283445"/><stop offset="55%" stop-color="#3d4e64"/><stop offset="100%" stop-color="#553d78"/>
    </linearGradient>
    <radialGradient id="halo1"><stop offset="0%" stop-color="#7c628b" stop-opacity=".55"/><stop offset="100%" stop-color="#7c628b" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2"><stop offset="0%" stop-color="#57708b" stop-opacity=".5"/><stop offset="100%" stop-color="#57708b" stop-opacity="0"/></radialGradient>
    <clipPath id="marco"><rect width="1280" height="400" rx="28"/></clipPath>
    <style>text{font-family:"Plus Jakarta Sans",Inter,"Segoe UI",system-ui,sans-serif}</style>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1280" height="400" fill="url(#fondo)"/>
    <circle cx="1120" cy="60"  r="320" fill="url(#halo1)"/>
    <circle cx="180"  cy="360" r="300" fill="url(#halo2)"/>

    <text x="72" y="132" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1.2">Bolsillo API</text>
    <text x="72" y="176" font-size="20" fill="#dcd9ee">El backend que hace las cuentas. El frontend solo las muestra.</text>
    <text x="72" y="208" font-size="15" fill="#c5b6d3">FastAPI · PostgreSQL · SQLAlchemy · JWT · arquitectura en capas</text>

    <g font-size="12.5" font-weight="600">
      <rect x="72"  y="238" width="104" height="30" rx="15" fill="#ffffff" fill-opacity=".14"/><text x="124" y="258" fill="#ffffff" text-anchor="middle">Python 3.12</text>
      <rect x="184" y="238" width="92"  height="30" rx="15" fill="#ffffff" fill-opacity=".14"/><text x="230" y="258" fill="#ffffff" text-anchor="middle">FastAPI</text>
      <rect x="284" y="238" width="112" height="30" rx="15" fill="#ffffff" fill-opacity=".14"/><text x="340" y="258" fill="#ffffff" text-anchor="middle">PostgreSQL 16</text>
      <rect x="404" y="238" width="86"  height="30" rx="15" fill="#ffffff" fill-opacity=".14"/><text x="447" y="258" fill="#ffffff" text-anchor="middle">JWT</text>
    </g>

    <!-- Las capas por las que pasa una petición, de fuera hacia dentro -->
    <g transform="translate(700 74)">
      <rect width="500" height="252" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="26" y="34" font-size="12" font-weight="700" fill="#c5b6d3" letter-spacing="1.2">POR DONDE PASA UNA PETICION</text>
      <g font-size="13.5">
        <rect x="26" y="50" width="448" height="32" rx="9" fill="#ffffff" fill-opacity=".10"/>
        <text x="42" y="71" fill="#ffffff" font-weight="600">routers</text><text x="150" y="71" fill="#dcd9ee">reciben HTTP y validan</text>
        <rect x="26" y="90" width="448" height="32" rx="9" fill="#ffffff" fill-opacity=".10"/>
        <text x="42" y="111" fill="#ffffff" font-weight="600">schemas</text><text x="150" y="111" fill="#dcd9ee">definen lo que entra y sale</text>
        <rect x="26" y="130" width="448" height="32" rx="9" fill="#ffffff" fill-opacity=".10"/>
        <text x="42" y="151" fill="#ffffff" font-weight="600">services</text><text x="150" y="151" fill="#dcd9ee">deciden: aqui vive la regla</text>
        <rect x="26" y="170" width="448" height="32" rx="9" fill="#ffffff" fill-opacity=".10"/>
        <text x="42" y="191" fill="#ffffff" font-weight="600">repositories</text><text x="150" y="191" fill="#dcd9ee">hablan con la base</text>
        <rect x="26" y="210" width="448" height="32" rx="9" fill="#ffffff" fill-opacity=".10"/>
        <text x="42" y="231" fill="#ffffff" font-weight="600">models</text><text x="150" y="231" fill="#dcd9ee">son las tablas</text>
      </g>
    </g>
  </g>
</svg>
